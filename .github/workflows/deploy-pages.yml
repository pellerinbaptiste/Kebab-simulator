name: Déploiement GitHub Pages

# Lancement manuel (Actions → Déploiement GitHub Pages → Run workflow) :
# le site principal est hébergé sur Vercel. Pour publier aussi sur GitHub Pages,
# activer Settings → Pages → Source : GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build statique
        run: npm run build
        env:
          # Le site est servi sur https://<user>.github.io/<dépôt>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Optionnel : variables du dépôt (Settings → Secrets and variables → Actions → Variables).
          # Vides = le site affiche « pas encore configuré ».
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
